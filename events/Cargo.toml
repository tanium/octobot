[package]
authors = ["Matt Hauck <matt.hauck@tanium.com>"]
name = "octobot_events"
version = "0.1.0"
edition = "2024"

[lib]
doc = false
name = "octobot_events"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.72"
log = "0.4.19"
prost = "0.14"
rand = "0.9"
ssh-agent-client-rs = "1.1.4"
ssh-key = { version = "0.6.7", features = ["std", "ed25519", "rsa", "ecdsa", "p256", "p384"] }
tokio = { version = "1.43.1", features = ["rt", "sync", "time", "macros"] }
tokio-stream = "0.1.17"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"

[dev-dependencies]
ssh-key = { version = "0.6.7", features = ["getrandom"] }
tokio = { version = "1.43.1", features = ["net"] }

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"
