<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octobot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%235b5bd6'/%3E%3Cpath d='M6 12.2a6 6 0 0 1 12 0v1.6H6Z' fill='%23fff'/%3E%3Crect x='7.4' y='9.2' width='9.2' height='3.1' rx='1.55' fill='%2314141a'/%3E%3Cpath d='M9 10.75h6' stroke='%23b9b9ff' stroke-width='1.1' stroke-linecap='round'/%3E%3Cpath d='M7.6 13.8v2.3a1.6 1.6 0 0 1-1.6 1.6M10.5 13.8v4.2M13.5 13.8v4.2M16.4 13.8v2.3a1.6 1.6 0 0 0 1.6 1.6' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- Sets the theme before first paint so dark mode does not flash light.
         Keep in step with theme.svelte.ts. -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('theme');
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
