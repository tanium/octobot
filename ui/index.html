<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octobot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%235b5bd6'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M6.5 12.5a5.5 5.5 0 0 1 11 0M6.5 12.5c0 2.5-1.5 3.5-1.5 5M10 12.5c0 2.5-.8 4 .2 6M14 12.5c0 2.5.8 4-.2 6M17.5 12.5c0 2.5 1.5 3.5 1.5 5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- Sets the theme before first paint so dark mode does not flash light.
         Keep in step with theme.svelte.ts. -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('theme');
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
