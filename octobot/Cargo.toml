[package]
authors = ["Matt Hauck <matt.hauck@tanium.com>"]
name = "octobot"
version = "0.1.0"
edition = "2024"

[[bin]]
doc = false
name = "octobot"
path = "src/main.rs"

[lib]
doc = false
name = "octobot"
path = "src/lib.rs"

[dependencies]
octobot_lib = { "path" = "../lib" }
octobot_ldap = { "path" = "../ldap" }
octobot_ops = { "path" = "../ops" }
env_logger = "0.11.11"
bytes = "1.11.1"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
log = "0.4.19"
regex = "1.9.3"
ring = "0.17.13"
serde = "1.0.183"
serde_derive = "1.0.183"
serde_json = "1.0.104"
thread-id = "4.1.0"
tokio = { version = "1.43.1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
async-trait = "0.1.72"
prometheus = "0.14.0"
maplit = "1.0.2"
time = "0.3.47"
hex = "0.4.3"
anyhow = { version = "1.0.72", features = ["backtrace"] }
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43.1", features = ["test-util"] }
