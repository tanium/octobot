version: 2

# Each ecosystem gets one PR for all minor and patch bumps.
# Major bumps stay out of the groups, so each gets its own PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
