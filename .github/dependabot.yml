version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR for compatible bumps; major bumps still get their own PRs.
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
