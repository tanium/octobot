name: Merge Dependabot PRs

# Merges Dependabot PRs once CI passes on them.
#
# This merges directly rather than through GitHub's auto-merge. A merge made
# with GITHUB_TOKEN starts no workflows, so CI and publish would skip it.
# Dispatching CI on main afterwards is the one way GITHUB_TOKEN can start them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    # Dependabot must have started the CI run, not only opened the PR.
    # A person rerunning CI or pushing to the branch gets no automatic merge.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'dependabot[bot]'

    runs-on: ubuntu-22.04

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
    - name: Approve
      run: gh pr review --approve "$PR"

    # Branch protection still holds the merge until every required check
    # passes. The SHA match refuses a head that Dependabot moved after this
    # CI run.
    - name: Merge
      run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR"

    - name: Run CI on main
      run: gh workflow run ci.yml --ref main
