name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Update apt
      run: sudo apt-get update

    - name: Install build packages
      run: sudo apt-get install libsqlite3-dev libldap2-dev

    - name: Install test packages
      run: sudo apt-get install python3.6 firejail

    # Installs the toolchain pinned in rust-toolchain.toml.
    - name: Install toolchain
      run: rustup toolchain install

    - name: Build
      run: cargo build

    - name: Test
      run: cargo test

    - name: Format
      run: cargo fmt --all -- --check

    - name: Lint
      run: cargo clippy --no-deps

  publish:
    needs: build
    if: github.repository == 'tanium/octobot' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build image
      run: ./build.py

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Push image
      run: |
        image=ghcr.io/${{ github.repository }}
        docker tag octobot:latest $image:${{ github.sha }}
        docker tag octobot:latest $image:latest
        docker push --all-tags $image
