name: Rust

on: [push]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@v1

    - name: Update apt
      run: sudo apt-get update

    - name: Install build packages
      run: sudo apt-get install libsqlite3-dev libldap2-dev

    - name: Install test packages
      run: sudo apt-get install python3.6 firejail

    - name: Install stable toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: 1.84.0
        override: false

    - name: Build
      uses: actions-rs/cargo@v1
      with:
        command: build

    - name: Test
      uses: actions-rs/cargo@v1
      with:
        command: test

    - name: Format
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: --all -- --check

    - name: Lint
      uses: actions-rs/cargo@v1
      with:
        command: clippy
        args: --no-deps

  publish:
    needs: build
    if: github.repository == 'tanium/octobot' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v4

    - name: Build image
      run: ./build.py

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Push image
      run: |
        image=ghcr.io/${{ github.repository }}
        docker tag octobot:latest $image:${{ github.sha }}
        docker tag octobot:latest $image:latest
        docker push --all-tags $image
