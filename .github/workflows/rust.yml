name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Update apt
      run: sudo apt-get update

    - name: Install build packages
      run: sudo apt-get install libsqlite3-dev libldap2-dev

    - name: Install test packages
      run: sudo apt-get install python3.6 firejail

    # Installs the toolchain pinned in rust-toolchain.toml.
    - name: Install toolchain
      run: rustup toolchain install

    - name: Build
      run: cargo build

    - name: Test
      run: cargo test

    - name: Format
      run: cargo fmt --all -- --check

    - name: Lint
      run: cargo clippy --no-deps

  publish:
    needs: build
    if: github.repository == 'tanium/octobot' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write
      # For the attest step: signing, storing, and linking the attestation.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build image
      run: ./build.py

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Push image
      id: push
      run: |
        image=ghcr.io/${{ github.repository }}
        docker tag octobot:latest $image:${{ github.sha }}
        docker tag octobot:latest $image:latest
        docker push --all-tags $image
        # RepoDigests is only filled in once the registry has the image.
        digest=$(docker inspect --format '{{index .RepoDigests 0}}' $image:${{ github.sha }})
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.push.outputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
