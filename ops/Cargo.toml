[package]
authors = ["Matt Hauck <matt.hauck@tanium.com>"]
name = "octobot_ops"
version = "0.1.0"
edition = "2024"

[lib]
doc = false
name = "octobot_ops"
path = "src/lib.rs"

[dependencies]
octobot_lib = { "path" = "../lib" }
conventional = "0.5.0"
log = "0.4.19"
regex = "1.9.3"
serde = "1.0.183"
serde_derive = "1.0.183"
tokio = { version = "1.43.1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["rt"] }
unidiff = "0.4.1"
reqwest = { version = "0.13.5", features = ["json"] }
async-trait = "0.1.72"
serde_json = "1.0.104"
rusqlite = { version = "0.37.0", features = ["bundled"] }
anyhow = { version = "1.0.72", features = ["backtrace"] }
pulldown-cmark = { version = "0.13.0", default-features = false }

[dev-dependencies]
maplit = "1.0.2"
tempfile = "3"
mockito = "1"
tokio = { version = "1.43.1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
